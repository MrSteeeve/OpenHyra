[project]
name = "openhyra"
version = "0.1.0"
description = "Open, task-pluggable reproduction of the Hyra research-agent harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Stochopia tasks/experiments (the sibling Stochopia repo is loaded via
# sys.path; structurerdsl is installed from the sibling StructurerDSL repo).
stochopia = ["torch", "httpx", "scipy", "structurerdsl", "python-dotenv"]
