[project]
name = "openhyra"
version = "0.1.0"
description = "Open, task-pluggable reproduction of the Hyra research-agent harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# World-model evaluation uses the sibling Stochopia research runtime.
world-model = ["httpx>=0.28.1", "PyYAML>=6.0.2", "tiktoken", "tokenizers", "huggingface-hub"]
