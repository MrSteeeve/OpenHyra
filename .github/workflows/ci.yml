name: CI

on:
  push:
    branches: [main, world-model, "p2/**", "codex/p2/**", "p2-*", "codex/p2-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: >-
      ${{ !(github.ref_name == 'world-model' || github.base_ref == 'world-model' || github.head_ref == 'world-model'
      || startsWith(github.ref_name, 'p2')
      || startsWith(github.ref_name, 'codex/p2')
      || startsWith(github.base_ref, 'p2')
      || startsWith(github.base_ref, 'codex/p2')
      || startsWith(github.head_ref, 'p2')
      || startsWith(github.head_ref, 'codex/p2')) }}
    # Historical research suites run on macOS; the world-model integration
    # jobs below verify the new worker lifecycle on Ubuntu.
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "numpy>=1.26" "pytest>=8.0"
      - run: python -m pytest tests/ -q

  stochopia-p0:
    name: Stochopia P0 integration
    if: >-
      github.ref_name == 'world-model' || github.base_ref == 'world-model' || github.head_ref == 'world-model'
      || startsWith(github.ref_name, 'p2')
      || startsWith(github.ref_name, 'codex/p2')
      || startsWith(github.base_ref, 'p2')
      || startsWith(github.base_ref, 'codex/p2')
      || startsWith(github.head_ref, 'p2')
      || startsWith(github.head_ref, 'codex/p2')
    runs-on: ubuntu-latest
    # The public P0 surface uses Stochopia main. Historical research suites
    # need Benchmark v3 and a checkout of the private StructurerDSL repository.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Stochopia main
        uses: actions/checkout@v7
        with:
          repository: MrSteeeve/Stochopia
          ref: main
          path: p0-stochopia
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: p0-stochopia/uv.lock
      - name: Sync locked dependencies
        working-directory: p0-stochopia
        run: uv sync --locked --all-extras --dev
      - name: Verify Stochopia and OpenHyra P0
        working-directory: p0-stochopia
        env:
          OPENHYRA_REPO: ${{ github.workspace }}
          STOCHOPIA_REPO: ${{ github.workspace }}/p0-stochopia
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --frozen pytest -q --junitxml "$RUNNER_TEMP/stochopia.xml" tests
          uv run --frozen pytest -q --junitxml "$RUNNER_TEMP/openhyra-p0.xml" \
            "$OPENHYRA_REPO"/tests/test_stochopia_tier0_*.py
          uv run --frozen python - "$RUNNER_TEMP/stochopia.xml" "$RUNNER_TEMP/openhyra-p0.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          skipped = []
          for path in sys.argv[1:]:
              report = ElementTree.parse(path)
              skipped.extend(case.attrib["name"] for case in report.iter("testcase") if case.find("skipped") is not None)
          if skipped:
              raise SystemExit("P0 CI skipped tests: " + ", ".join(skipped))
          PY

  stochopia-p1:
    name: Stochopia P1/P2 Linux integration
    if: >-
      github.ref_name == 'world-model' || github.base_ref == 'world-model' || github.head_ref == 'world-model'
      || startsWith(github.ref_name, 'p2')
      || startsWith(github.ref_name, 'codex/p2')
      || startsWith(github.base_ref, 'p2')
      || startsWith(github.base_ref, 'codex/p2')
      || startsWith(github.head_ref, 'p2')
      || startsWith(github.head_ref, 'codex/p2')
    # Workers use trusted research code and process-group lifecycle control.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Stochopia main
        uses: actions/checkout@v7
        with:
          repository: MrSteeeve/Stochopia
          ref: main
          path: p1-stochopia
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: p1-stochopia/uv.lock
      - name: Sync locked dependencies
        working-directory: p1-stochopia
        run: uv sync --locked --all-extras --dev
      - name: Verify OpenHyra P1/P2 and worker lifecycle on Linux
        working-directory: p1-stochopia
        env:
          OPENHYRA_REPO: ${{ github.workspace }}
          STOCHOPIA_REPO: ${{ github.workspace }}/p1-stochopia
          PYTHONPATH: ${{ github.workspace }}
        run: |
          shopt -s nullglob
          p2_tests=("$OPENHYRA_REPO"/tests/test_stochopia_p2_*.py "$OPENHYRA_REPO"/tests/test_p2_*.py)
          uv run --frozen pytest -q --junitxml "$RUNNER_TEMP/openhyra-p1.xml" \
            "$OPENHYRA_REPO"/tests/test_stochopia_p1_*.py \
            "$OPENHYRA_REPO"/tests/test_training_sandbox.py "${p2_tests[@]}"
          uv run --frozen python - "$RUNNER_TEMP/openhyra-p1.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          report = ElementTree.parse(sys.argv[1])
          skipped = [case.attrib["name"] for case in report.iter("testcase") if case.find("skipped") is not None]
          if skipped:
              raise SystemExit("P1 CI skipped tests: " + ", ".join(skipped))
          PY
