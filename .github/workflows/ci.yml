name: CI

on:
  push:
    branches: [main, world-model, "p2/**", "codex/p2/**", "p2-*", "codex/p2-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: >-
      ${{ !(github.ref_name == 'world-model' || github.base_ref == 'world-model' || github.head_ref == 'world-model'
      || startsWith(github.ref_name, 'p2')
      || startsWith(github.ref_name, 'codex/p2')
      || startsWith(github.base_ref, 'p2')
      || startsWith(github.base_ref, 'codex/p2')
      || startsWith(github.head_ref, 'p2')
      || startsWith(github.head_ref, 'codex/p2')) }}
    # Historical research suites run on macOS; the world-model integration
    # jobs below verify the new worker lifecycle on Ubuntu.
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "numpy>=1.26" "pytest>=8.0"
      - run: python -m pytest tests/ -q

  lob-world-model:
    name: LOB World-Model Linux Integration
    if: >-
      github.ref_name == 'world-model' || github.base_ref == 'world-model' || github.head_ref == 'world-model'
      || startsWith(github.ref_name, 'p2')
      || startsWith(github.ref_name, 'codex/p2')
      || startsWith(github.base_ref, 'p2')
      || startsWith(github.base_ref, 'codex/p2')
      || startsWith(github.head_ref, 'p2')
      || startsWith(github.head_ref, 'codex/p2')
    # Workers use trusted research code and process-group lifecycle control.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Stochopia main
        uses: actions/checkout@v7
        with:
          repository: MrSteeeve/Stochopia
          ref: main
          path: lob-stochopia
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: lob-stochopia/uv.lock
      - name: Sync locked dependencies
        working-directory: lob-stochopia
        run: uv sync --locked --all-extras --dev
      - name: Install OpenHyra provider transport dependencies
        working-directory: lob-stochopia
        run: uv pip install --python .venv/bin/python "httpx==0.28.1" "PyYAML==6.0.3"
      - name: Verify Stochopia and LOB world-model integration on Linux
        working-directory: lob-stochopia
        env:
          OPENHYRA_REPO: ${{ github.workspace }}
          STOCHOPIA_REPO: ${{ github.workspace }}/lob-stochopia
          PYTHONPATH: ${{ github.workspace }}
        run: |
          shopt -s nullglob
          p2_tests=("$OPENHYRA_REPO"/tests/test_p2_*.py)
          uv run --frozen --no-sync pytest -q --junitxml "$RUNNER_TEMP/stochopia.xml" tests
          uv run --frozen --no-sync pytest -q --junitxml "$RUNNER_TEMP/lob-world-model.xml" \
            "$OPENHYRA_REPO"/tests/test_lob_world_model_*.py \
            "$OPENHYRA_REPO"/tests/test_training_sandbox.py "${p2_tests[@]}"
          uv run --frozen --no-sync python - "$RUNNER_TEMP/stochopia.xml" "$RUNNER_TEMP/lob-world-model.xml" <<'PYTHON'
          import sys
          from xml.etree import ElementTree

          skipped = []
          for path in sys.argv[1:]:
              report = ElementTree.parse(path)
              skipped.extend(case.attrib["name"] for case in report.iter("testcase") if case.find("skipped") is not None)
          if skipped:
              raise SystemExit("LOB world-model CI skipped tests: " + ", ".join(skipped))
          PYTHON
