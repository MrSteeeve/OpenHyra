   <g id="text_1">
    <text style="font: 700 10px 'DejaVu Sans'; text-anchor: start" x="7.2" y="16.905157" transform="rotate(-0 7.2 16.905157)">A  Search loop and independent gap evaluation</text>
   </g>
   <g id="text_2">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(25.495766 56.291674)">Context Agent</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(19.080312 65.421481)">structured history</text>
   </g>
   <g id="text_3">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(133.655484 56.291674)">Proposal Agent</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(137.415031 65.421481)">program edit</text>
   </g>
   <g id="text_4">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(238.997422 51.72677)">Python algorithm</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(248.696625 60.856577)">fit + predict</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(242.724594 69.986385)">stopping policy</text>
   </g>
   <g id="text_5">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(26.873719 122.30189)">Experience Bank</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(30.463875 131.431697)">code, outcome</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(36.270562 140.561505)">and lineage</text>
   </g>
   <g id="text_6">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(184.482141 126.866794)">Public evaluator</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(158.983938 135.996601)">rollout payoff and uncertainty</text>
   </g>
   <g id="text_7">
    <text style="font: 7.2px 'DejaVu Sans'; text-anchor: middle" x="198.594" y="102.0024" transform="rotate(-0 198.594 102.0024)">original feedback: payoff LCB ↑</text>
   </g>
   <g id="text_8">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(322.245047 117.386554)">Freeze candidate</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(324.523438 126.516361)">before final test</text>
   </g>
   <g id="text_9">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(163.156469 180.23669)">Independent test paths</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(177.561031 189.366497)">policy return Lπ</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(165.225578 198.496305)">common dual upper U</text>
   </g>
   <g id="text_10">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(325.543109 184.801594)">Gap = U − Lπ</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(325.398578 193.931401)">+ uncertainty</text>
   </g>
   <g id="text_11">
