   <g id="text_1">
    <text style="font: 700 9px 'DejaVu Sans'; text-anchor: start" x="7.2" y="17.586754" transform="rotate(-0 7.2 17.586754)">B  Matched feedback ablation</text>
   </g>
   <g id="text_2">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(128.269328 37.497514)">Shared frozen history + identical parent</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(140.664906 46.627321)">3 seeds × 2 prescribed operators</text>
   </g>
   <g id="text_3">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(60.843906 83.49389)">Structured memory</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(41.361094 92.623697)">score + bounds + uncertainty</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(30.055859 101.753505)">historical behavior and mechanisms</text>
   </g>
   <g id="text_4">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(271.733797 83.49389)">Score-only memory</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(235.436797 92.623697)">same candidate IDs and source hashes</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(271.954641 101.753505)">status + scalar gap</text>
   </g>
   <g id="text_5">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(61.386766 134.184874)">Context → Proposal</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(39.23475 143.314681)">same model and call/time caps</text>
   </g>
   <g id="text_6">
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(272.310766 134.184874)">Context → Proposal</text>
    <text style="font: 7.4px 'DejaVu Sans'" transform="translate(250.15875 143.314681)">same model and call/time caps</text>
   </g>
   <g id="text_7">
    <text style="font: 8px 'DejaVu Sans'; text-anchor: middle" x="202.5" y="171.3024" transform="rotate(-0 202.5 171.3024)">Calibration gap → freeze selections → separate final holdout</text>
   </g>
